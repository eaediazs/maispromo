    { nome:'ViajaMais',     cat:'Viagem',       icon:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>', bg:'#FFF9E0', basic:'1%',  plus:'2%',       premium:'3%',          plano:'basic',   desc:'Agência de turismo com pacotes nacionais e internacionais.' },
    { nome:'BomGarfo',      cat:'Restaurante',  icon:'', bg:'#FFF9E0', basic:'2%',  plus:'6%',       premium:'8%',          plano:'basic',   desc:'Rede de hamburguerias artesanais com delivery rápido.' },
    { nome:'DelivExpress',  cat:'Restaurante',  icon:'', bg:'#FFF0E8', basic:'3%',  plus:'5%',       premium:'7%',          plano:'basic',   desc:'App de delivery com mais de 500 restaurantes cadastrados.' },
    { nome:'TasteNow',      cat:'Restaurante',  icon:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>', bg:'#E8FAF0', basic:'2%',  plus:'6%',       premium:'8%',          plano:'basic',   desc:'Restaurantes gourmet com reservas e cardápio exclusivo.' },
    { nome:'PetroPrime',    cat:'Combustível',  icon:'', bg:'#FFF9E0', basic:'2%',  plus:'3%',       premium:'4%',          plano:'basic',   desc:'Rede de postos com mais de 800 unidades no Brasil.' },
    { nome:'GasFull',       cat:'Combustível',  icon:'', bg:'#E8FAF0', basic:'1%',  plus:'2%',       premium:'4%',          plano:'basic',   desc:'Postos com loja de conveniência e lavagem de veículos.' },
    { nome:'PlayStream',    cat:'Streaming',    icon:'', bg:'#E8F4FF', basic:'—',   plus:'Incluso',  premium:'Incluso',     plano:'plus',    desc:'Streaming de filmes e séries com catálogo de 10.000+ títulos.' },
    { nome:'CineMax+',      cat:'Streaming',    icon:'', bg:'#F0EEFF', basic:'—',   plus:'—',        premium:'Incluso',     plano:'premium', desc:'Cinema online com estreias exclusivas e conteúdo premium.' },
    { nome:'StyleOn',       cat:'Moda',         icon:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>', bg:'#F8EEFF', basic:'3%',  plus:'8%',       premium:'10%',         plano:'plus',    desc:'Moda feminina com entrega expressa e troca gratuita.' },
    { nome:'FashionHub',    cat:'Moda',         icon:'', bg:'#FFF0F0', basic:'3%',  plus:'7%',       premium:'10%',         plano:'plus',    desc:'Multimarcas com as principais tendências do mercado.' },
    { nome:'UrbanWear',     cat:'Moda',         icon:'', bg:'#E8FAF0', basic:'2%',  plus:'6%',       premium:'9%',          plano:'basic',   desc:'Moda casual e streetwear com frete grátis acima de R$150.' },
    { nome:'TechStore',     cat:'Tecnologia',   icon:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>', bg:'#E8FAF0', basic:'2%',  plus:'4%',       premium:'5%',          plano:'basic',   desc:'Eletrônicos e gadgets com garantia estendida grátis.' },
    { nome:'GadgetShop',    cat:'Tecnologia',   icon:'', bg:'#FFF9E0', basic:'2%',  plus:'4%',       premium:'5%',          plano:'basic',   desc:'Acessórios e periféricos para casa, escritório e games.' },
    { nome:'EduPrime',      cat:'Educação',     icon:'', bg:'#FFF0E8', basic:'5%',  plus:'10%',      premium:'10%+2meses',  plano:'basic',   desc:'Plataforma de cursos online com certificados reconhecidos.' },
    { nome:'CursoFlex',     cat:'Educação',     icon:'', bg:'#E8F4FF', basic:'5%',  plus:'8%',       premium:'10%',         plano:'basic',   desc:'Cursos profissionalizantes e preparatórios online.' },
    { nome:'FitLife',       cat:'Saúde',        icon:'', bg:'#E8FAF0', basic:'3%',  plus:'6%',       premium:'8%',          plano:'basic',   desc:'Academia e academia online com planos mensais flexíveis.' },
    { nome:'NutriPlus',     cat:'Saúde',        icon:'', bg:'#FFF9E0', basic:'4%',  plus:'7%',       premium:'8%',          plano:'basic',   desc:'Nutrição e suplementos com acompanhamento nutricional.' },
  ];

  let filtroAtivo = 'todos';
  let buscaAtiva  = '';

  const grid = document.getElementById('partners-grid');

  // ─────────────────────────────────────────────
  // INOVAÇÃO 4 — Fluid Filter com FLIP Animation
  // Técnica: First, Last, Invert, Play
  // 1. Grava posições (First)
  // 2. Atualiza DOM (Last)
  // 3. Calcula diff de posição (Invert)
  // 4. Anima de volta ao lugar (Play)
  // ─────────────────────────────────────────────

  function getFiltered() {
    return PARCEIROS.filter(p => {
      const catOk = filtroAtivo === 'todos' || p.cat === filtroAtivo;
      const busOk = p.nome.toLowerCase().includes(buscaAtiva.toLowerCase());
      return catOk && busOk;
    });
  }

  function buildCardHTML(p, idx) {
    const renderIcon = p.icon || getIcon(p.cat);
    return `
      <div class="p-card" data-plano="${p.plano}" data-idx="${idx}" tabindex="0">
        ${p.plano==='premium'?'<div class="p-pro">PRO</div>':''}
        <div class="p-logo" style="background:${p.bg}">${renderIcon}</div>
        <div class="p-name">${p.nome}</div>
        <div class="p-cat">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M5 3v2l1.5 1" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          ${p.cat}
        </div>
        <div class="p-cashback">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5L6.2 4H9L6.8 5.7l.8 2.8L5 7.1l-2.6 1.4.8-2.8L1 4h2.8z" fill="currentColor"/></svg>
          ${p.plus} cashback
        </div>
      </div>`;
  }

  // Initial render (no animation)
  function initialRender() {
    const filtered = getFiltered();
    document.getElementById('results-count').textContent = `${filtered.length} parceiro${filtered.length!==1?'s':''}`;
    document.getElementById('empty-state').classList.toggle('show', filtered.length === 0);

    grid.innerHTML = filtered.map((p, i) => buildCardHTML(p, PARCEIROS.indexOf(p))).join('');

    // Staggered entrance on first load
    grid.querySelectorAll('.p-card').forEach((card, i) => {
      card.style.animationDelay = (i * 35) + 'ms';
      card.classList.add('entering');
    });

    bindCardEvents();
  }

  // FLIP-animated filter transition
  function filterWithFlip() {
    const existingCards = Array.from(grid.querySelectorAll('.p-card'));

    // Step 1 — FIRST: record current positions
    const firstPositions = new Map();
    existingCards.forEach(card => {
      firstPositions.set(card.dataset.idx, card.getBoundingClientRect());
    });

    // Step 2 — Determine new set
    const filtered = getFiltered();
    document.getElementById('results-count').textContent = `${filtered.length} parceiro${filtered.length!==1?'s':''}`;
    document.getElementById('empty-state').classList.toggle('show', filtered.length === 0);

    // IDs in old vs new sets
    const newIdxSet = new Set(filtered.map(p => String(PARCEIROS.indexOf(p))));
    const oldIdxSet = new Set(existingCards.map(c => c.dataset.idx));

    // Step 3 — Hide removed cards
    existingCards.forEach(card => {
      if (!newIdxSet.has(card.dataset.idx)) {
        card.classList.add('flip-transit','hiding');
      }
    });

    // Step 4 — After exit anim, rebuild and play entrance
    setTimeout(() => {
      grid.innerHTML = filtered.map((p, i) => buildCardHTML(p, PARCEIROS.indexOf(p))).join('');

      const newCards = Array.from(grid.querySelectorAll('.p-card'));

      newCards.forEach((card, i) => {
        // If it was in the old set, play FLIP
        if (oldIdxSet.has(card.dataset.idx)) {
          const first = firstPositions.get(card.dataset.idx);
          if (first) {
            const last = card.getBoundingClientRect();
            const dx = first.left - last.left;
            const dy = first.top  - last.top;
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
              card.style.transition = 'none';
              card.style.transform  = `translate(${dx}px,${dy}px)`;
              void card.offsetWidth; // force reflow
              card.style.transition = 'transform .38s cubic-bezier(.4,0,.2,1), opacity .3s ease';
              card.style.transform  = '';
            }
          }
        } else {
          // New card — staggered entrance
          card.style.animationDelay = (i * 30) + 'ms';
          card.classList.add('entering');
        }
      });

      bindCardEvents();
    }, 200); // match hiding transition
  }

  function bindCardEvents() {
    // Spotlight glow
    grid.querySelectorAll('.p-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
        card.style.setProperty('--my', (e.clientY - rect.top)  + 'px');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      });
      card.addEventListener('click', () => openModal(PARCEIROS[+card.dataset.idx]));
    });
  }

  // ── Filter chips ──────────────────────────────
  document.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      filtroAtivo = btn.dataset.cat;
      filterWithFlip();
    });
  });

  // ── Search ─────────────────────────────────────
  let searchTimeout;
  document.getElementById('search-input').addEventListener('input', function() {
    buscaAtiva = this.value;
    document.getElementById('search-clear').style.display = this.value ? 'flex' : 'none';
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(filterWithFlip, 120);
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    buscaAtiva = '';
    document.getElementById('search-clear').style.display = 'none';
    filterWithFlip();
  });

  // ── Modal ──────────────────────────────────────
  function openModal(p) {
    const renderIcon = p.icon || getIcon(p.cat);
    document.getElementById('modal-icon').style.background = p.bg;
    document.getElementById('modal-icon').innerHTML = renderIcon;
    document.getElementById('modal-title').textContent = p.nome;
    document.getElementById('modal-sub').textContent = p.cat;
    document.getElementById('modal-body').innerHTML = `
      <p style="font-size:14px;color:#555;margin-bottom:18px;line-height:1.65">${p.desc}</p>
      <div class="modal-row">
        <span class="modal-row-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="vertical-align:middle;margin-right:5px"><circle cx="6" cy="6" r="5" fill="rgba(100,149,237,.15)" stroke="#6495ed" stroke-width="1.2"/></svg>
          Plano Basic
        </span>
        <span class="modal-row-value">${p.basic} cashback</span>
      </div>
      <div class="modal-row">
        <span class="modal-row-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="vertical-align:middle;margin-right:5px"><path d="M6 1.5L7.2 4.5H10L7.6 6.4l.9 3L6 7.8l-2.5 1.6.9-3L2 4.5h2.8z" fill="#F7C500"/></svg>
          Plano Plus
        </span>
        <span class="modal-row-value">${p.plus} cashback</span>
      </div>
      <div class="modal-row">
        <span class="modal-row-label">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style="vertical-align:middle;margin-right:5px"><path d="M6 1.5L7.2 4.5H10L7.6 6.4l.9 3L6 7.8l-2.5 1.6.9-3L2 4.5h2.8z" fill="#000"/></svg>
          Plano Premium
        </span>
        <span class="modal-row-value">${p.premium} cashback</span>
      </div>
      <div class="modal-row">
        <span class="modal-row-label">Plano mínimo</span>
        <span class="modal-row-value" style="text-transform:capitalize">${p.plano}</span>
      </div>
    `;
    document.getElementById('modal-overlay').classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
  });
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if(e.target === e.currentTarget) document.getElementById('modal-overlay').classList.remove('open');
  });

  // Init
  initialRender();
</script>
<script type="module" src="/js/promo-elite.js?v=1.2"></script>
